name: Servidor Bedrock

# Este workflow va en un repositorio PUBLICO que contiene SOLO este archivo.
# Los packs viven en un repositorio PRIVADO, en OTRA CUENTA, y se clonan aqui.
#
# Por que publico: en repos publicos los minutos de Actions son ilimitados; en
# privados el plan Free da 2.000 al mes (33 h) y luego se para. Al no subir los
# packs aqui, tampoco se redistribuye contenido con licencia NoDerivatives.
#
# Por que dos cuentas: si esta cuenta acaba suspendida por usar Actions para
# alojar un servidor, la cuenta con los packs no se ve afectada.
#
# Hacen falta DOS tokens, uno por cuenta:
#   PACKS_TOKEN  - de la cuenta de los packs. Solo Contents: read en ese repo.
#   CHAIN_TOKEN  - de esta cuenta. Solo Actions: read+write en este repo.
# Separarlos limita el dano si uno se filtra.

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que debe correr el servidor antes de guardar y reiniciar"
        required: false
        default: "335"
      mundo_nuevo:
        description: "Empezar un mundo NUEVO (el actual no se borra: se guarda en la release 'mundo-anterior')"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "si"

concurrency:
  group: servidor-bedrock
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 1.26.33.2 A PROPOSITO, no la ultima.
  # Con el servidor en 1.26.36 y el cliente en 1.26.33, el cliente era
  # rechazado en el saludo inicial con un mensaje que despista mucho, "You are
  # not whitelisted on this server!", aun con allow-list=false confirmado en el
  # servidor. La pista buena fue que el servidor NO anotaba el intento en su
  # registro: el corte ocurria antes de considerarlo siquiera una conexion.
  # Se fija a la version del cliente. De la serie 1.26.33 se elige la .2, que es
  # la ultima y por tanto la mas asentada; la .1 tambien existe.
  # Si algun dia hay que actualizar, hay que subir esto Y que los jugadores
  # actualicen su Minecraft: las dos cosas tienen que ir a la par.
  BDS_VERSION: "1.26.33.2"
  REPO_PACKS: ${{ vars.REPO_PACKS }}     # ej: villasori466-hub/server-minecraft-bedrock
  MUNDO: CronicaDelCataclismo
  # Direccion fija del tunel de portmap.io. Corresponde a la regla
  #   udp://lionel123lave-36820.portmap.host:36820 => 19132
  # de la configuracion 'minecraft'. Si algun dia se rehace la regla, se
  # cambia AQUI y solo aqui.
  TUNEL_HOST: "lionel123lave-36820.portmap.host"
  TUNEL_PUERTO: "36820"

jobs:
  servidor:
    # Ubuntu 22.04 A PROPOSITO, no 'ubuntu-latest'.
    # 'ubuntu-latest' apunta ya a 24.04, y Mojang solo soporta 22.04 para el
    # servidor Bedrock: en 24.04 el binario puede no arrancar por versiones de
    # glibc/libssl. Fijarlo evita que el runner cambie bajo nuestros pies.
    runs-on: ubuntu-22.04
    # El limite duro de un job son 6 h (360 min). Dejamos margen para guardar.
    timeout-minutes: 350

    steps:
      - name: Descargar este repo
        uses: actions/checkout@v4

      # Falla pronto y con un mensaje util. Sin esto, un secreto mal puesto
      # revienta en el checkout con un "repository not found" que no dice nada.
      - name: Comprobar configuracion
        env:
          PACKS_TOKEN: ${{ secrets.PACKS_TOKEN }}
          CHAIN_TOKEN: ${{ secrets.CHAIN_TOKEN }}
          PORTMAP_OVPN: ${{ secrets.PORTMAP_OVPN }}
          REPO_PACKS: ${{ vars.REPO_PACKS }}
        run: |
          fallo=0

          echo "--- Variable REPO_PACKS ---"
          if [ -z "${REPO_PACKS:-}" ]; then
            echo "::error::Falta la VARIABLE 'REPO_PACKS'. Settings > Secrets and variables > Actions > pestana Variables > New repository variable. Valor: usuario/repositorio"
            fallo=1
          elif ! echo "$REPO_PACKS" | grep -qE '^[^/]+/[^/]+$'; then
            echo "::error::REPO_PACKS vale '$REPO_PACKS' y deberia ser 'usuario/repositorio', sin https:// ni .git"
            fallo=1
          else
            echo "OK: $REPO_PACKS"
          fi

          echo "--- Secretos presentes ---"
          for s in PACKS_TOKEN CHAIN_TOKEN PORTMAP_OVPN; do
            v="${!s:-}"
            if [ -z "$v" ]; then
              echo "::error::Falta el SECRETO '$s' (o esta creado como Environment secret en vez de Repository secret)"
              fallo=1
            else
              echo "OK: $s presente (${#v} caracteres)"
            fi
          done

          [ "$fallo" -eq 1 ] && exit 1

          echo "--- El token VE el repositorio? (permiso Metadata) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PACKS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_PACKS")
          echo "HTTP $code"
          case "$code" in
            200) echo "OK: el token ve el repositorio" ;;
            401) echo "::error::PACKS_TOKEN invalido o caducado. Generalo de nuevo."; exit 1 ;;
            404) echo "::error::El token no ve '$REPO_PACKS'. O lo creaste con la cuenta equivocada (debe ser la DUENA del repo privado), o en 'Repository access' no marcaste ese repositorio."; exit 1 ;;
            *) echo "::error::Respuesta inesperada: $code"; exit 1 ;;
          esac

          # OJO: la llamada de arriba pasa con el permiso 'Metadata', que TODOS los
          # fine-grained tokens traen de serie. Para CLONAR hace falta 'Contents',
          # asi que hay que comprobarlo aparte o el checkout falla igual.
          echo "--- El token puede LEER ARCHIVOS? (permiso Contents) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PACKS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_PACKS/contents/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Al PACKS_TOKEN le falta el permiso 'Contents: Read-only'. Ve a https://github.com/settings/personal-access-tokens (con la cuenta duena del repo privado), abre el token, seccion 'Repository permissions', pon Contents = Read-only y guarda con 'Update token'."
            exit 1
          fi
          echo "OK: el token puede clonar el repositorio"

      - name: Clonar los packs desde el repo privado
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPO_PACKS }}
          token: ${{ secrets.PACKS_TOKEN }}
          path: packs

      - name: Descargar el servidor Bedrock
        run: |
          set -euo pipefail
          echo "Sistema: $(. /etc/os-release && echo "$PRETTY_NAME")"

          # Herramientas que damos por hechas mas abajo
          for t in unzip zip curl; do
            command -v "$t" >/dev/null || { echo "Instalando $t..."; sudo apt-get install -y -qq "$t"; }
          done

          curl -fsSL -A "Mozilla/5.0" \
            -o bds.zip \
            "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${BDS_VERSION}.zip"
          mkdir -p server
          unzip -q bds.zip -d server
          rm bds.zip
          chmod +x server/bedrock_server

          # Si le falta alguna libreria, mejor saberlo AHORA y no cuando no arranque
          echo "--- dependencias del binario ---"
          if ldd server/bedrock_server 2>/dev/null | grep -i "not found"; then
            echo "::error::Al binario del servidor le faltan librerias en este sistema."
            exit 1
          fi
          echo "OK: todas las librerias resueltas"
          echo "BDS $BDS_VERSION listo"

      - name: Montar el modpack
        run: |
          set -euo pipefail
          # los packs del repo privado pisan a los del servidor si coinciden
          cp -r packs/behavior_packs/* server/behavior_packs/
          cp -r packs/resource_packs/* server/resource_packs/
          cp packs/server.properties server/server.properties
          # Sin esto, el dueno entra como 'member' y no puede usar NI UN comando:
          # ni /time, ni /gamemode, ni /setworldspawn, aunque allow-cheats este
          # activado. La lista de operadores va por XUID, no por nombre.
          #
          # Es OPCIONAL a proposito. Este paso corre con 'set -e', y un fichero
          # que falta no puede tumbar el servidor entero: sin operadores se juega
          # igual, solo que sin comandos. Avisar y seguir.
          if [ -f packs/permissions.json ]; then
            cp packs/permissions.json server/permissions.json
            echo "Operadores declarados: $(grep -c '"permission"' server/permissions.json || echo 0)"
          else
            echo "::warning::El repo de packs no trae permissions.json. Nadie sera operador y no se podran usar comandos dentro del juego."
          fi
          echo "Packs instalados:"
          ls packs/behavior_packs | wc -l
          ls packs/resource_packs | wc -l

      - name: Ajustar configuracion para el runner
        run: |
          set -euo pipefail
          cd server
          # El runner tiene 4 vCPU y 16 GB: mas holgado que el PC de casa.
          #
          # max-threads=3 y no 4, y aqui el motivo cambio aunque el numero no:
          # antes era "dejar un hilo al sistema" del i5 de casa. Ahora el hilo
          # que hay que dejar libre es el de OpenVPN, que cifra CADA paquete que
          # entra y sale del tunel. Si el servidor se come los 4 vCPU, el cifrado
          # se pone a la cola y eso es latencia anadida a todos los jugadores.
          sed -i 's/^max-threads=.*/max-threads=3/'      server.properties
          # 8 en vez de 10: el area de terreno crece con el cuadrado, asi que
          # son un 36% menos de datos por el tunel. Medido: los jugadores estan
          # a ~200 ms con 3% de perdida, y el terreno es el grueso del trafico.
          sed -i 's/^view-distance=.*/view-distance=8/'  server.properties
          sed -i 's/^tick-distance=.*/tick-distance=6/'  server.properties

          # AJUSTES DE LATENCIA, forzados aqui y no solo heredados del repo de
          # packs. Son los que hacen que se juegue distinto a 200 ms, asi que no
          # pueden depender de que nadie los borre por descuido del otro lado.
          # El porque de cada uno esta en el server.properties del repo de packs.
          fijar() {
            if grep -q "^$1=" server.properties; then
              sed -i "s/^$1=.*/$1=$2/" server.properties
            else
              echo "$1=$2" >> server.properties
            fi
          }
          fijar compression-algorithm zlib
          fijar compression-threshold 1
          fijar player-position-acceptance-threshold 1.0
          fijar server-authoritative-movement-strict false
          fijar server-authoritative-dismount-strict false
          fijar server-authoritative-entity-interactions-strict false
          fijar client-side-chunk-generation-enabled true

          # LISTA DE PERMITIDOS: apagada SIEMPRE y a la fuerza.
          # Si queda encendida con un allowlist.json vacio, el servidor rechaza a
          # TODO el mundo con "You are not whitelisted on this server!", que
          # parece un fallo de conexion y no lo es. El repo ya la trae en false,
          # pero el BDS trae su propio server.properties y no conviene depender
          # de que el copiado gane siempre.
          if grep -q '^allow-list=' server.properties; then
            sed -i 's/^allow-list=.*/allow-list=false/' server.properties
          else
            echo 'allow-list=false' >> server.properties
          fi
          # Por si el paquete del servidor trae una lista heredada
          echo '[]' > allowlist.json

          # AUTENTICACION DE XBOX ENCENDIDA. No la apagues.
          # Estuvo en false un rato, persiguiendo un "You are not whitelisted on
          # this server!" que resulto NO tener nada que ver: el jugador tenia mal
          # el puerto en su entrada de servidor guardada y sus paquetes ni
          # llegaban aqui (el contador RX del tunel seguia a cero mientras lo
          # intentaba). Se restaura porque con online-mode=false el servidor no
          # comprueba la identidad de NADIE: cualquiera que sepa la direccion
          # entra con el nombre que quiera, incluido el del dueno.
          #
          # Si algun dia alguien no puede entrar, mirar PRIMERO si su trafico
          # llega (RX del tunel en la release 'tunel') antes de tocar esto.
          if grep -q '^online-mode=' server.properties; then
            sed -i 's/^online-mode=.*/online-mode=true/' server.properties
          else
            echo 'online-mode=true' >> server.properties
          fi

          # Dejar A LA VISTA lo que el servidor va a leer de verdad. Sin esto,
          # discutir sobre que valor tiene una propiedad es adivinar.
          echo "--- server.properties EFECTIVO ---"
          grep -vE '^#|^$' server.properties

      - name: Restaurar el mundo de la sesion anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          mkdir -p "server/worlds/${MUNDO}"

          # UN MUNDO DE OTRA VERSION NO SE RESTAURA A CIEGAS.
          # Bedrock no garantiza abrir un mundo creado por una version mas nueva:
          # puede negarse a cargarlo o corromperlo. Junto al mundo se guarda la
          # version del servidor que lo escribio; si no coincide con la actual,
          # ese mundo se APARTA a la release 'mundo-anterior' (no se borra jamas)
          # y se empieza uno nuevo.
          # Un mundo sin marca de version se considera de otra version: es el
          # caso de la primera sesion tras bajar de 1.26.36 a 1.26.33.
          ver_guardada=""
          if gh release download mundo --repo "$REPO" --pattern bds-version.txt --dir /tmp 2>/dev/null; then
            ver_guardada=$(tr -d '[:space:]' < /tmp/bds-version.txt)
          fi

          # Se puede pedir un mundo nuevo a mano al lanzar el workflow. Aunque se
          # pida, el anterior NO se borra: se aparta igual que en un cambio de
          # version. Borrar la partida de alguien no puede depender de un
          # desplegable mal pulsado.
          pedido_nuevo="${{ github.event.inputs.mundo_nuevo || 'no' }}"
          fresco=si

          if gh release download mundo --repo "$REPO" --pattern world.zip --dir . 2>/dev/null; then
            motivo=""
            if [ "$pedido_nuevo" = "si" ]; then
              motivo="lo has pedido al lanzar la ejecucion"
            elif [ "$ver_guardada" != "$BDS_VERSION" ]; then
              motivo="el guardado es de la version '${ver_guardada:-desconocida}' y ahora se usa ${BDS_VERSION}"
            fi

            if [ -z "$motivo" ]; then
              unzip -q world.zip -d "server/worlds/${MUNDO}"
              rm world.zip
              fresco=no
              echo "Mundo restaurado ($(du -sh server/worlds/${MUNDO} | cut -f1))"
            else
              echo "::warning::Se empieza un mundo NUEVO porque $motivo. El anterior no se borra."
              gh release view mundo-anterior --repo "$REPO" >/dev/null 2>&1 \
                || gh release create mundo-anterior --repo "$REPO" \
                     --title "Mundo de una version anterior" \
                     --notes "Mundo apartado al cambiar de version del servidor. No se borra: si se vuelve a esa version, se puede recuperar desde aqui."
              # Con fecha y numero de ejecucion en el nombre: si se aparta un
              # mundo mas de una vez, el segundo no puede pisar al primero.
              archivo="world-${ver_guardada:-desconocida}-$(date -u +%Y%m%d-%H%M)-run${{ github.run_number }}.zip"
              mv world.zip "$archivo"
              gh release upload mundo-anterior "$archivo" --repo "$REPO" --clobber
              rm -f "$archivo"
              echo "Mundo anterior a salvo como '$archivo' en la release 'mundo-anterior'."
            fi
          else
            echo "No hay mundo guardado todavia: se creara uno nuevo"
          fi

          # Se lo pasamos al paso del servidor: solo en un mundo recien generado
          # tiene sentido forzar que amanezca.
          echo "MUNDO_FRESCO=$fresco" >> "$GITHUB_ENV"
          echo "Mundo recien generado: $fresco"

          # registrar los packs SIEMPRE (por si el mundo venia sin ellos)
          cp packs/_world_config/world_behavior_packs.json "server/worlds/${MUNDO}/"
          cp packs/_world_config/world_resource_packs.json "server/worlds/${MUNDO}/"

      # RED DIRECTA CON ZEROTIER. Sustituye al intento de playit, que esta
      # descartado con datos tras cinco ejecuciones (ver el README).
      #
      # La idea es distinta: aqui NO hay rele. El jugador y el runner se meten
      # en la misma red virtual y se hablan directamente, asi que el trafico
      # deja de dar la vuelta por Londres. Ese rodeo es el 70% del ping.
      #
      # El precio: cada jugador instala ZeroTier una vez y se une a la red. A
      # cambio no necesitan crearse cuenta, solo el ID de la red.
      #
      # POR QUE ZEROTIER Y NO TAILSCALE: Tailscale atraviesa NAT algo mejor,
      # pero su plan gratuito son 3 usuarios y aqui sois 4 o mas. ZeroTier da
      # 25 dispositivos en una red y no gasta usuarios.
      #
      # QUE HACE FALTA (si falta algo, no se intenta y no pasa nada):
      #   variable ZT_RED     el ID de 16 digitos de la red
      #   secreto  ZT_TOKEN   token de la API de ZeroTier Central
      #   variable ZT_IP      OPCIONAL. Si no se pone, se calcula sola.
      #
      # EL TOKEN NO ES UN CAPRICHO. Cada sesion arranca en una maquina nueva,
      # que para ZeroTier es un dispositivo desconocido y entra sin autorizar.
      # Sin la API habria que ir a autorizarlo A MANO cada 5 h y media. Con
      # ella, el runner se autoriza solo Y se pone SIEMPRE LA MISMA IP, que es
      # lo que permite a los jugadores guardar el servidor una vez y olvidarse.
      - name: Red directa opcional (ZeroTier)
        id: malla
        env:
          ZT_RED: ${{ vars.ZT_RED }}
          ZT_IP: ${{ vars.ZT_IP }}
          ZT_TOKEN: ${{ secrets.ZT_TOKEN }}
        run: |
          # Sin 'set -e': esto es un extra y no puede tumbar la sesion.
          set +e
          echo "ok=no" >> "$GITHUB_OUTPUT"

          # DECIR CUAL FALTA, no "no configurada" a secas. Callarse aqui costo una
          # sesion entera: el paso salia en verde, el fichero decia "no
          # configurada" y no habia forma de saber si el fallo era el nombre, la
          # pestana o el repositorio. Los avisos ademas se leen por la API sin
          # autenticarse, mientras que los logs del job dan 403 desde fuera.
          FALTA=""
          [ -z "${ZT_RED:-}" ]   && FALTA="$FALTA ZT_RED(variable)"
          [ -z "${ZT_TOKEN:-}" ] && FALTA="$FALTA ZT_TOKEN(secreto)"
          if [ -n "$FALTA" ]; then
            echo "::warning::Red directa no activa: llega vacio ->$FALTA . Comprueba TRES cosas: (1) que sea el repo mc-runner, (2) que ZT_RED este en la pestana Variables y ZT_TOKEN en la pestana Secrets, no al reves, (3) que sean 'Repository' y no 'Environment'. Se sigue con el tunel de portmap."
            echo "Red directa no configurada. Se juega por el tunel de portmap, como siempre."
            exit 0
          fi
          echo "ZT_RED recibido (${#ZT_RED} caracteres), ZT_TOKEN recibido (${#ZT_TOKEN} caracteres)"

          # ZT_IP es OPCIONAL. Si no se pone, se calcula sola preguntandole a la
          # API por el rango de la red y cogiendo el .200. Asi hay una variable
          # menos que configurar y, sobre todo, una menos que equivocar: poner a
          # mano una IP fuera del rango de la red es un fallo silencioso que solo
          # se nota cuando nadie puede entrar.
          # Se elige el .200 porque ZeroTier reparte desde abajo: es el rincon
          # donde menos probable es chocar con el movil de alguien.
          if [ -z "${ZT_IP:-}" ]; then
            ZT_IP=$(curl -s -H "Authorization: token ${ZT_TOKEN}" \
              "https://api.zerotier.com/api/v1/network/${ZT_RED}" \
              | node -e '
                let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                  try{
                    const j=JSON.parse(d);
                    const r=(j.config&&j.config.routes&&j.config.routes[0]&&j.config.routes[0].target)||"";
                    const base=r.split("/")[0];
                    if(!base){ process.exit(1); }
                    console.log(base.split(".").slice(0,3).join(".")+".200");
                  }catch(e){ process.exit(1); }
                });')
            if [ -z "$ZT_IP" ]; then
              echo "::warning::No se ha podido leer el rango de la red $ZT_RED. Comprueba el ZT_TOKEN. Se sigue solo con portmap."
              exit 0
            fi
            echo "IP calculada a partir del rango de la red: $ZT_IP"
          else
            echo "IP fijada a mano en la variable ZT_IP: $ZT_IP"
          fi

          echo "--- instalando ZeroTier ---"
          # Instalador oficial del proyecto: comprueba su propia firma GPG.
          curl -s https://install.zerotier.com | sudo bash > /tmp/zt_install.log 2>&1
          if ! command -v zerotier-cli >/dev/null 2>&1; then
            echo "::warning::No se ha podido instalar ZeroTier. Se sigue solo con portmap."
            tail -15 /tmp/zt_install.log 2>/dev/null
            exit 0
          fi

          sudo systemctl start zerotier-one 2>/dev/null
          sleep 5

          NODO=$(sudo zerotier-cli info 2>/dev/null | awk '{print $3}')
          if [ -z "$NODO" ]; then
            echo "::warning::ZeroTier no ha arrancado. Se sigue solo con portmap."
            exit 0
          fi
          echo "nodo de este runner: $NODO"

          sudo zerotier-cli join "$ZT_RED" >/dev/null 2>&1
          sleep 5

          # AUTORIZARSE Y RESERVAR LA IP, via API. Las dos cosas en la misma
          # llamada: authorized lo mete en la red, ipAssignments le clava
          # siempre la misma direccion.
          echo "--- autorizando este runner en la red y fijando $ZT_IP ---"
          COD=$(curl -s -o /tmp/zt_api.json -w "%{http_code}" \
            -X POST "https://api.zerotier.com/api/v1/network/${ZT_RED}/member/${NODO}" \
            -H "Authorization: token ${ZT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"runner-${{ github.run_number }}\",\"description\":\"servidor bedrock, sesion ${{ github.run_number }}\",\"config\":{\"authorized\":true,\"ipAssignments\":[\"${ZT_IP}\"]}}")
          echo "HTTP $COD"
          case "$COD" in
            200) echo "OK: autorizado" ;;
            401|403) echo "::warning::El ZT_TOKEN no vale o no tiene permisos. Se sigue solo con portmap."; exit 0 ;;
            404) echo "::warning::No existe la red $ZT_RED (o el token no la ve). Se sigue solo con portmap."; exit 0 ;;
            *)   echo "::warning::La API de ZeroTier ha respondido $COD. Se intenta seguir igualmente." ;;
          esac

          # ESPERAR A LA IP DE VERDAD. Que la API diga que si no significa que
          # la interfaz ya la tenga: el nodo tiene que recibir la configuracion.
          echo "--- esperando a que la interfaz coja la IP ---"
          TIENE=0
          for i in $(seq 1 20); do
            if ip -o -4 addr show 2>/dev/null | grep -q "$ZT_IP"; then TIENE=1; break; fi
            sleep 3
          done

          if [ "$TIENE" -ne 1 ]; then
            echo "::warning::ZeroTier no ha llegado a coger $ZT_IP. Se sigue solo con portmap."
            sudo zerotier-cli listnetworks 2>/dev/null
            exit 0
          fi

          echo "ok=si" >> "$GITHUB_OUTPUT"
          echo "ip=$ZT_IP" >> "$GITHUB_OUTPUT"
          echo "$ZT_IP" > /tmp/zt_ip.txt
          echo "OK: el servidor esta en la red directa con la IP $ZT_IP"
          ip -o -4 addr show | grep "$ZT_IP"

          # Estado para el fichero publico, igual que se hace con el tunel: sin
          # esto, saber si la red sigue en pie exige los logs del job, y esos
          # dan 403 desde fuera.
          (
            set +e
            while true; do
              if ip -o -4 addr show 2>/dev/null | grep -q "$ZT_IP"; then
                echo "$(date -u +%H:%M:%S) red directa OK en $ZT_IP" > /tmp/zt_estado.txt
              else
                echo "$(date -u +%H:%M:%S) red directa CAIDA" > /tmp/zt_estado.txt
                sudo zerotier-cli join "$ZT_RED" >/dev/null 2>&1
              fi
              sleep 30
            done
          ) > /dev/null 2>&1 &
          disown 2>/dev/null || true


      - name: Levantar el tunel de portmap.io
        env:
          PORTMAP_OVPN: ${{ secrets.PORTMAP_OVPN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # POR QUE YA NO SE USA PLAYIT.
          # El agente de playit v1.0.10 pide sus servidores de control a la API
          # y recibe SOLO objetivos IPv6; si el envio falla no reintenta por
          # IPv4. Los runners de GitHub son solo IPv4, asi que la sesion de
          # control nunca se establecia: el agente autenticaba y decia
          # "tunnels loaded", pero no reenviaba ni un paquete. Comprobado en
          # vivo (el log se quedaba congelado en SessionNotSetup) y es un bug
          # abierto de upstream, playit-cloud/playit-agent#194, no algo que se
          # pueda arreglar desde aqui.
          # portmap.io hace el reenvio por OpenVPN, da direccion fija y no
          # tiene limite de tiempo ni de trafico en su plan basico.

          if [ -z "${PORTMAP_OVPN:-}" ]; then
            echo "::error::Falta el secreto PORTMAP_OVPN. Pega ahi el contenido ENTERO del fichero .ovpn de la configuracion 'minecraft' de portmap.io."
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn

          umask 077
          printf '%s\n' "$PORTMAP_OVPN" > /tmp/portmap.ovpn

          # ESTO SE AFINO CON DATOS, no de primeras.
          # El peligro real es que el .ovpn traiga 'redirect-gateway': eso se
          # lleva TODA la salida del runner por el VPN, el job pierde el camino
          # a GitHub y se rompen la subida del mundo y el encadenado. Se perderia
          # la partida.
          #
          # El primer intento uso --route-nopull, que efectivamente protegio la
          # ruta por defecto... pero se paso de frenada: rechazaba TAMBIEN la
          # ruta de vuelta que portmap empuja, y lo dijo en su log:
          #     Options error: option 'route' cannot be used in this context
          # El sintoma era enganoso: el tunel montado, el servidor escuchando en
          # 19132, los paquetes ENTRANDO de verdad (RX = 1 paquete tras un ping),
          # y ni una respuesta de vuelta. Con la tabla de rutas cortada a
          # 10.8.80.213/32, la respuesta salia por eth0 y se perdia.
          #
          # --pull-filter es el bisturi que hacia falta: acepta las rutas que
          # portmap necesita y descarta SOLO la directiva peligrosa.
          sudo openvpn --config /tmp/portmap.ovpn \
            --pull-filter ignore "redirect-gateway" \
            --daemon --log /tmp/openvpn.log

          # Esperar a que aparezca la interfaz del tunel y coja IP
          TUN=""
          for i in $(seq 1 30); do
            sleep 2
            TUN=$(ip -o -4 addr show 2>/dev/null | awk '$2 ~ /^(tun|tap)/ {print $2}' | head -1)
            if [ -n "$TUN" ]; then break; fi
          done

          echo "--- log de openvpn ---"
          sudo tail -30 /tmp/openvpn.log 2>/dev/null || true

          if [ -z "$TUN" ]; then
            echo "::error::El VPN de portmap no llego a levantar ninguna interfaz. Sin tunel nadie puede conectarse."
            sudo cat /tmp/openvpn.log 2>/dev/null || true
            exit 1
          fi
          IPVPN=$(ip -o -4 addr show dev "$TUN" | awk '{print $4}' | cut -d/ -f1)
          echo "OK: tunel levantado en $TUN con IP $IPVPN"

          # Filtrar 'redirect-gateway' no basta por si solo: un servidor puede
          # quedarse igualmente con la salida empujando dos rutas /1
          # (0.0.0.0/1 y 128.0.0.0/1), que ganan a la default sin sustituirla.
          # Por eso se comprueba a las claras por donde sale el trafico.
          DEFDEV=$(ip route show default | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -1)
          echo "salida por defecto: ${DEFDEV:-ninguna}"
          case "${DEFDEV:-}" in
            tun*|tap*)
              echo "::error::El VPN se ha quedado con la ruta por defecto del runner. Se cierra el tunel para no arriesgar el mundo."
              sudo pkill openvpn 2>/dev/null || true
              exit 1 ;;
          esac

          # RED DE SEGURIDAD FINAL, la que de verdad importa: si el runner se
          # quedara sin camino a GitHub, el mundo no se podria guardar al final.
          # Vale mas enterarse ahora y abortar limpio que descubrirlo cinco horas
          # despues habiendo perdido la partida.
          if ! curl -fsS -o /dev/null --max-time 20 https://api.github.com; then
            echo "::error::Al levantar el VPN se ha perdido la conexion con GitHub. Se cierra el tunel para no arriesgar el mundo."
            sudo pkill openvpn 2>/dev/null || true
            exit 1
          fi
          echo "OK: GitHub sigue accesible, la ruta por defecto esta intacta"

          # "Sigue vivo?" - lo usa tambien el publicador de mas abajo
          vivo() {
            pgrep -x openvpn >/dev/null 2>&1
          }

          # DE DONDE SALE EL PING. Esto es diagnostico puro y NUNCA debe tumbar
          # el job: todo va con '|| true'.
          #
          # El ping que sufre un jugador son dos tramos sumados:
          #   jugador -> servidor de portmap   (se mide desde casa)
          #   portmap -> este runner           (solo se puede medir AQUI)
          # Sin el segundo no se sabe si la culpa es del tunel o de donde cayo
          # el runner, y GitHub no deja elegir region. Medido en agosto de 2026:
          # runner en Virginia, portmap en Londres, jugadores en Santo Domingo.
          # Resultado, 218 ms: el trafico cruza el Atlantico dos veces para nada.
          echo "--- de donde ha salido este runner ---"
          REGION=$(curl -fsS --max-time 10 https://ipinfo.io/json 2>/dev/null \
                   | tr -d '"{},' | awk -F: '/city|region|country|org/ {gsub(/^ +/,"",$2); print $1"="$2}' \
                   | paste -sd' ' -) || REGION=""
          echo "${REGION:-no se ha podido averiguar}"

          # RTT hasta la boca del tunel, por dentro del propio tunel. Es el
          # segundo tramo. Si portmap no contesta a ICMP queda en blanco, que
          # tampoco es un problema: es informativo.
          GWVPN=$(ip -o -4 addr show dev "$TUN" 2>/dev/null \
                  | grep -o 'peer [0-9.]*' | awk '{print $2}' | head -1)
          [ -z "$GWVPN" ] && GWVPN=$(echo "$IPVPN" | awk -F. '{print $1"."$2"."$3".1"}')
          echo "--- RTT de este runner a la boca del tunel ($GWVPN) ---"
          RTT=$(ping -c 5 -W 2 "$GWVPN" 2>/dev/null | tail -1 \
                | awk -F'/' '{printf "%.0f ms", $5}') || RTT=""
          echo "${RTT:-sin respuesta a ICMP}"

          # La direccion ya no hay que rascarla de ningun log: en portmap es fija
          # y esta arriba, en las variables del workflow. Se deja bien visible en
          # el resumen de la ejecucion, que sale arriba del todo en la pagina del
          # run.
          {
            echo "# Servidor Bedrock en marcha"
            echo ""
            echo '## Direccion para entrar'
            echo ""
            # Si la red directa esta en pie se anuncia ella primero: es la misma
            # partida, pero sin rele por medio. El tunel queda de reserva para
            # quien no tenga ZeroTier instalado.
            if [ "${{ steps.malla.outputs.ok }}" = "si" ]; then
              echo "Hay **dos formas de entrar** al mismo servidor."
              echo ""
              echo "| | Servidor | Puerto | Requiere |"
              echo "|---|---|---|---|"
              echo "| **Directa (rapida)** | \`${{ steps.malla.outputs.ip }}\` | \`19132\` | ZeroTier instalado y unido a la red |"
              echo "| Tunel (reserva) | \`${TUNEL_HOST}\` | \`${TUNEL_PUERTO}\` | nada |"
              echo ""
              echo "La directa evita el rele de Londres, que es el 70% del ping."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| Servidor | \`${TUNEL_HOST}\` |"
              echo "| Puerto | \`${TUNEL_PUERTO}\` |"
            fi
            echo ""
            echo "En Minecraft: **Jugar > Servidores > Anadir servidor**. El puerto va en su casilla aparte, no pegado al nombre."
            echo ""
            echo "- Minecraft **1.26.33** exacto | 9 addons + capa visual | 6 jugadores"
            echo "- La primera conexion descarga bastantes MB de packs: parece colgado pero no lo esta."
            echo "- Para que se vea como debe: **Ajustes > Video > Vibrant Visuals ACTIVADO**. Sin eso las texturas se ven planas."
            echo "- Escribe **\`!guia\`** en el chat para abrir la Cronica del Cataclismo."
            echo "- El servidor se reinicia solo cada ~5h35m. La direccion NO cambia."
            echo ""
            echo "<details><summary>De donde sale el ping de esta sesion</summary>"
            echo ""
            echo "| Tramo | |"
            echo "|---|---|"
            echo "| Runner de GitHub | ${REGION:-desconocido} |"
            echo "| Runner -> boca del tunel | ${RTT:-sin medir} |"
            echo ""
            echo "El ping total de un jugador es ese tramo mas el suyo hasta el"
            echo "servidor de portmap. GitHub no deja elegir donde cae el runner,"
            echo "asi que este numero cambia entre sesiones."
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Direccion del servidor::${TUNEL_HOST} puerto ${TUNEL_PUERTO}"

          # VENTANA AL RUNNER, en vivo.
          # Los logs de Actions solo los ve un admin y el diagnostico final no
          # se publica hasta que acaba el job, 5 h y media despues. Sin esto,
          # cuando el agente conecta pero el tunel no reenvia, no hay forma de
          # saber por que sin esperar toda la sesion.
          # Un asset de release en un repo publico se lee SIN autenticarse, asi
          # que se refresca cada minuto durante los primeros 25, que es cuando
          # se decide si el tunel sirve trafico o no.
          # OJO: esto acaba siendo PUBLICO. OpenVPN no vuelca claves en su log,
          # pero como el .ovpn si las lleva, se filtran por si acaso los bloques
          # PEM antes de publicar. Mas vale la linea de sed que un disgusto.
          REPO="${{ github.repository }}"
          gh release view tunel --repo "$REPO" >/dev/null 2>&1 \
            || gh release create tunel --repo "$REPO" \
                 --title "Estado del tunel en vivo" \
                 --notes "Se refresca cada minuto durante los primeros 25 de cada sesion. No contiene secretos."
          (
            # Sin 'set -e' aqui dentro: este bucle es solo un observador y no
            # debe morirse porque 'ss' o una subida fallen una vez.
            set +e
            for n in $(seq 1 25); do
              {
                echo "=== TUNEL - ejecucion ${{ github.run_number }} - minuto $n - $(date -u) ==="
                echo "direccion publica: ${TUNEL_HOST}:${TUNEL_PUERTO}"
                echo "interfaz: ${TUN}  IP del tunel: ${IPVPN}"
                echo
                echo "--- sigue vivo el openvpn? ---"
                if vivo; then echo "SI"; else echo "NO: se ha muerto"; fi
                echo
                echo "--- red directa (ZeroTier) ---"
                if [ -f /tmp/zt_ip.txt ]; then
                  ZTIP=$(cat /tmp/zt_ip.txt)
                  echo "direccion directa: ${ZTIP}:19132"
                  cat /tmp/zt_estado.txt 2>/dev/null
                  echo "miembros que ve este nodo:"
                  sudo zerotier-cli listnetworks 2>/dev/null | tail -3 || echo "(zerotier-cli no responde)"
                  # Que el servidor conteste EN esa IP. Se pregunta desde el
                  # propio runner: no prueba el camino del jugador, pero si que
                  # el Bedrock esta sirviendo por la interfaz de ZeroTier, que es
                  # la mitad que depende de nosotros.
                  if node -e '
                    const d=require("dgram"), s=d.createSocket("udp4");
                    const MAGIC=Buffer.from("00ffff00fefefefefdfdfdfd12345678","hex");
                    const b=Buffer.alloc(33); b.writeUInt8(0x01,0);
                    b.writeBigInt64BE(BigInt(Date.now()),1); MAGIC.copy(b,9);
                    s.on("message",(m)=>{ if(m[0]===0x1c) process.exit(0); });
                    const i=setInterval(()=>s.send(b,19132,process.argv[1]),1000);
                    setTimeout(()=>{ clearInterval(i); process.exit(1); },8000);
                  ' "$ZTIP" >/dev/null 2>&1; then
                    echo "el servidor RESPONDE en la IP directa"
                  else
                    echo "el servidor no responde todavia en la IP directa (puede seguir cargando packs)"
                  fi
                else
                  echo "no configurada en esta sesion"
                fi
                echo
                echo "--- log de openvpn (sin bloques PEM) ---"
                sudo sed -e '/BEGIN .*PRIVATE KEY/,/END .*PRIVATE KEY/d' \
                         -e '/BEGIN CERTIFICATE/,/END CERTIFICATE/d' \
                         /tmp/openvpn.log 2>/dev/null | tail -40 || echo "(sin log)"
                echo
                echo "--- interfaz del tunel ---"
                ip -4 addr show dev "$TUN" 2>/dev/null || echo "(la interfaz ya no existe)"
                echo
                echo "--- rutas (la default NO debe ir por el tunel) ---"
                ip route 2>/dev/null | head -10
                echo
                echo "--- trafico que ha pasado por el tunel ---"
                # Si aqui los contadores siguen a cero cuando alguien ha
                # intentado entrar, es que portmap no esta reenviando.
                ip -s link show dev "$TUN" 2>/dev/null | tail -5
                echo
                echo "--- puertos UDP ---"
                ss -ulnp 2>/dev/null | head -20
                echo
                echo "--- lista de permitidos (debe estar en false) ---"
                grep -iE '^(allow-list|white-list|online-mode|max-players)=' server/server.properties 2>/dev/null || echo "(no se puede leer server.properties)"
                echo
                echo "--- INTENTOS DE CONEXION y por que se rechazan ---"
                grep -iaE 'player|connect|disconnect|whitelist|allow|kick' /tmp/bds.log 2>/dev/null | tail -15 || echo "(ninguno todavia)"
                echo
                echo "--- ultimas lineas del servidor ---"
                tail -15 /tmp/bds.log 2>/dev/null || echo "(el servidor aun no ha arrancado)"
              } > /tmp/tunel.txt 2>&1
              gh release upload tunel /tmp/tunel.txt --repo "$REPO" --clobber >/dev/null 2>&1 || true
              sleep 60
            done
          ) &
          echo "Publicador del estado del tunel lanzado (25 minutos)"

      - name: Arrancar el servidor
        id: servidor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MIN="${{ github.event.inputs.minutos || '335' }}"
          SEGS=$(( MIN * 60 ))
          cd server
          chmod +x bedrock_server

          # FIFO para poder mandarle 'stop' limpiamente y no matar el proceso:
          # matarlo a lo bruto deja la base de datos LevelDB a medio escribir.
          #
          # Se abre en lectura-escritura (3<>) a proposito: abrir un FIFO solo
          # para escritura se queda bloqueado hasta que alguien lo abra para
          # leer, y aqui el lector es el propio servidor, que aun no ha
          # arrancado. Asi ademas el servidor nunca ve EOF en su stdin.
          mkfifo /tmp/bds_in
          exec 3<> /tmp/bds_in
          LD_LIBRARY_PATH=. ./bedrock_server < /tmp/bds_in > /tmp/bds.log 2>&1 &
          BDS=$!

          # COMPROBAR QUE ARRANCA DE VERDAD.
          # Antes se dormia 335 min sin mirar: si el binario petaba, el paso
          # seguia "en curso" y parecia que todo iba bien, pero no habia servidor.
          echo "Esperando a que el servidor este listo..."
          listo=0
          for i in $(seq 1 60); do
            sleep 5
            if grep -q "Server started" /tmp/bds.log 2>/dev/null; then listo=1; break; fi
            if ! kill -0 $BDS 2>/dev/null; then
              echo "::error::El servidor murio durante el arranque."
              echo "----- salida del servidor -----"; cat /tmp/bds.log; exit 1
            fi
          done

          echo "----- primeras lineas del servidor -----"
          head -40 /tmp/bds.log || true

          if [ "$listo" -ne 1 ]; then
            echo "::error::El servidor no llego a decir 'Server started' en 5 minutos."
            echo "----- salida completa -----"; cat /tmp/bds.log; exit 1
          fi

          echo "::notice title=Servidor listo::Aceptando conexiones"

          # QUE EL PRIMER DIA SEA DE DIA.
          # En un mundo recien generado los jugadores aparecian de noche, en
          # dificultad hard y con Horde Nights activo: una horda de zombis encima
          # antes de tener con que defenderse. Se fuerza el amanecer UNICAMENTE
          # en la sesion que genera el mundo; despues el ciclo sigue solo y las
          # noches de horda quedan intactas, que para eso esta el mod.
          if [ "${MUNDO_FRESCO:-no}" = "si" ]; then
            sleep 3
            echo 'time set day' >&3
            sleep 2
            echo 'say Mundo nuevo: amanece. Aprovechad el dia para prepararos.' >&3
            echo "Mundo recien generado: amanecer forzado"
          fi

          # Comprobar que esta escuchando en UDP 19132, que es el puerto local al
          # que apunta la regla de portmap. Escucha en 0.0.0.0, asi que tambien
          # recibe lo que entra por la interfaz del tunel.
          ss -ulnp 2>/dev/null | grep -E '19132' || echo "AVISO: no veo el puerto 19132 escuchando"

          # DIAGNOSTICO TEMPRANO: se publica con el servidor YA corriendo, para
          # poder ver el estado del tunel sin esperar 5 horas a que acabe el job.
          {
            echo "=== EN VIVO - ejecucion ${{ github.run_number }} - $(date -u) ==="
            echo
            echo "--- puertos UDP ---"; ss -ulnp 2>/dev/null | head -20
            echo
            echo "--- ultimas lineas del servidor ---"; tail -25 /tmp/bds.log
            echo
            echo "--- tunel de portmap (openvpn, sin bloques PEM) ---"
            sudo sed -e '/BEGIN .*PRIVATE KEY/,/END .*PRIVATE KEY/d' \
                     -e '/BEGIN CERTIFICATE/,/END CERTIFICATE/d' \
                     /tmp/openvpn.log 2>/dev/null | tail -25 || echo "no encontrado"
            echo
            echo "--- interfaz del tunel ---"; ip -4 addr show 2>/dev/null | grep -A2 -E '^[0-9]+: (tun|tap)' || echo "(ninguna)"
            echo
            echo "--- prueba local: responde el servidor en 127.0.0.1:19132? ---"
            timeout 5 bash -c 'printf "\x01" > /dev/udp/127.0.0.1/19132' 2>&1 && echo "puerto alcanzable" || echo "no alcanzable"
          } > /tmp/envivo.txt 2>&1

          gh release view envivo --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create envivo --repo "${{ github.repository }}" \
                 --title "Estado en vivo" --notes "Estado publicado con el servidor corriendo. Sin secretos."
          gh release upload envivo /tmp/envivo.txt --repo "${{ github.repository }}" --clobber || true
          echo "Diagnostico en vivo publicado"

          echo "Servidor arrancado (PID $BDS). Correra $MIN minutos."
          # Aviso a los jugadores 5 minutos antes del reinicio
          if [ "$SEGS" -gt 300 ]; then
            sleep $(( SEGS - 300 ))
            echo 'say §e[Servidor] Reinicio programado en 5 minutos. El mundo se guarda automaticamente.' >&3
            sleep 240
            echo 'say §c[Servidor] Reiniciando en 60 segundos...' >&3
            sleep 60
          else
            sleep "$SEGS"
          fi

          echo "Enviando stop..."
          echo 'stop' >&3
          wait $BDS || true
          echo "Servidor detenido limpiamente"

      # Los logs de Actions solo los ve quien tiene permisos de admin en el repo.
      # Esto publica un diagnostico como asset de una release, que en un repo
      # publico se puede leer sin autenticarse. Sin secretos dentro.
      - name: Publicar diagnostico
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=/tmp/diagnostico.txt
          {
            echo "=== EJECUCION ${{ github.run_number }}  $(date -u) ==="
            echo
            echo "--- sistema ---"
            uname -a; echo; cat /etc/os-release | head -3
            echo
            echo "--- servidor bedrock ---"
            if [ -f /tmp/bds.log ]; then
              echo "(ultimas 60 lineas)"; tail -60 /tmp/bds.log
            else
              echo "NO existe /tmp/bds.log: el servidor ni se lanzo"
            fi
            echo
            echo "--- librerias que le faltan al binario ---"
            ldd server/bedrock_server 2>/dev/null | grep -i "not found" || echo "(ninguna)"
            echo
            echo "--- tunel de portmap (openvpn, sin bloques PEM) ---"
            if [ -f /tmp/openvpn.log ]; then
              sudo sed -e '/BEGIN .*PRIVATE KEY/,/END .*PRIVATE KEY/d' \
                       -e '/BEGIN CERTIFICATE/,/END CERTIFICATE/d' \
                       /tmp/openvpn.log | tail -40
            else
              echo "NO existe /tmp/openvpn.log: el tunel ni se lanzo"
            fi
            echo
            echo "--- interfaces y rutas ---"
            ip -4 addr show 2>/dev/null | grep -A2 -E '^[0-9]+: (tun|tap)' || echo "(no hay interfaz de tunel)"
            ip route 2>/dev/null | head -10
            echo
            echo "--- puertos UDP escuchando ---"
            ss -ulnp 2>/dev/null || echo "(ss no disponible)"
          } > "$D" 2>&1

          gh release view diagnostico --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create diagnostico --repo "${{ github.repository }}" \
                 --title "Diagnostico" --notes "Ultimo diagnostico automatico. No contiene secretos."
          gh release upload diagnostico "$D" --repo "${{ github.repository }}" --clobber
          echo "Diagnostico publicado"

      - name: Guardar el mundo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d "server/worlds/${MUNDO}/db" ]; then
            echo "::warning::No hay mundo que guardar"
            exit 0
          fi
          cd "server/worlds/${MUNDO}"
          zip -qr /tmp/world.zip .
          cd -
          echo "Mundo comprimido: $(du -h /tmp/world.zip | cut -f1)"
          gh release view mundo --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create mundo --repo "${{ github.repository }}" \
                 --title "Mundo guardado" --notes "Ultima partida guardada automaticamente."
          gh release upload mundo /tmp/world.zip --repo "${{ github.repository }}" --clobber

          # La version que escribio este mundo viaja CON el mundo. Es lo que
          # permite detectar en el arranque siguiente que se ha cambiado de
          # version y no abrirlo con una incompatible.
          printf '%s\n' "$BDS_VERSION" > /tmp/bds-version.txt
          gh release upload mundo /tmp/bds-version.txt --repo "${{ github.repository }}" --clobber
          echo "Mundo subido a la release 'mundo' (version $BDS_VERSION)"

      # Solo se encadena si el servidor LLEGO A ARRANCAR. Antes se relanzaba
      # pase lo que pase, asi que un secreto mal puesto generaba un bucle de
      # ejecuciones fallidas una detras de otra.
      - name: Encadenar la siguiente sesion
        if: always() && steps.servidor.conclusion != 'skipped'
        env:
          # GITHUB_TOKEN no puede disparar otro workflow (proteccion anti-bucle):
          # hace falta un token personal, y de ESTA cuenta, no la de los packs.
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run servidor.yml --repo "${{ github.repository }}" \
            -f minutos="${{ github.event.inputs.minutos || '335' }}"
          echo "Siguiente sesion encolada"
