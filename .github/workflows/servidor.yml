name: Servidor Bedrock

# Este workflow va en un repositorio PUBLICO que contiene SOLO este archivo.
# Los packs viven en un repositorio PRIVADO, en OTRA CUENTA, y se clonan aqui.
#
# Por que publico: en repos publicos los minutos de Actions son ilimitados; en
# privados el plan Free da 2.000 al mes (33 h) y luego se para. Al no subir los
# packs aqui, tampoco se redistribuye contenido con licencia NoDerivatives.
#
# Por que dos cuentas: si esta cuenta acaba suspendida por usar Actions para
# alojar un servidor, la cuenta con los packs no se ve afectada.
#
# Hacen falta DOS tokens, uno por cuenta:
#   PACKS_TOKEN  - de la cuenta de los packs. Solo Contents: read en ese repo.
#   CHAIN_TOKEN  - de esta cuenta. Solo Actions: read+write en este repo.
# Separarlos limita el dano si uno se filtra.

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que debe correr el servidor antes de guardar y reiniciar"
        required: false
        default: "335"

concurrency:
  group: servidor-bedrock
  cancel-in-progress: false

permissions:
  contents: write

env:
  BDS_VERSION: "1.26.36.1"
  REPO_PACKS: ${{ vars.REPO_PACKS }}     # ej: villasori466-hub/server-minecraft-bedrock
  MUNDO: CronicaDelCataclismo

jobs:
  servidor:
    runs-on: ubuntu-latest
    # El limite duro de un job son 6 h (360 min). Dejamos margen para guardar.
    timeout-minutes: 350

    steps:
      - name: Descargar este repo
        uses: actions/checkout@v4

      # Falla pronto y con un mensaje util. Sin esto, un secreto mal puesto
      # revienta en el checkout con un "repository not found" que no dice nada.
      - name: Comprobar configuracion
        env:
          PACKS_TOKEN: ${{ secrets.PACKS_TOKEN }}
          CHAIN_TOKEN: ${{ secrets.CHAIN_TOKEN }}
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
          REPO_PACKS: ${{ vars.REPO_PACKS }}
        run: |
          fallo=0

          echo "--- Variable REPO_PACKS ---"
          if [ -z "${REPO_PACKS:-}" ]; then
            echo "::error::Falta la VARIABLE 'REPO_PACKS'. Settings > Secrets and variables > Actions > pestana Variables > New repository variable. Valor: usuario/repositorio"
            fallo=1
          elif ! echo "$REPO_PACKS" | grep -qE '^[^/]+/[^/]+$'; then
            echo "::error::REPO_PACKS vale '$REPO_PACKS' y deberia ser 'usuario/repositorio', sin https:// ni .git"
            fallo=1
          else
            echo "OK: $REPO_PACKS"
          fi

          echo "--- Secretos presentes ---"
          for s in PACKS_TOKEN CHAIN_TOKEN PLAYIT_SECRET; do
            v="${!s:-}"
            if [ -z "$v" ]; then
              echo "::error::Falta el SECRETO '$s' (o esta creado como Environment secret en vez de Repository secret)"
              fallo=1
            else
              echo "OK: $s presente (${#v} caracteres)"
            fi
          done

          [ "$fallo" -eq 1 ] && exit 1

          echo "--- El token VE el repositorio? (permiso Metadata) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PACKS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_PACKS")
          echo "HTTP $code"
          case "$code" in
            200) echo "OK: el token ve el repositorio" ;;
            401) echo "::error::PACKS_TOKEN invalido o caducado. Generalo de nuevo."; exit 1 ;;
            404) echo "::error::El token no ve '$REPO_PACKS'. O lo creaste con la cuenta equivocada (debe ser la DUENA del repo privado), o en 'Repository access' no marcaste ese repositorio."; exit 1 ;;
            *) echo "::error::Respuesta inesperada: $code"; exit 1 ;;
          esac

          # OJO: la llamada de arriba pasa con el permiso 'Metadata', que TODOS los
          # fine-grained tokens traen de serie. Para CLONAR hace falta 'Contents',
          # asi que hay que comprobarlo aparte o el checkout falla igual.
          echo "--- El token puede LEER ARCHIVOS? (permiso Contents) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $PACKS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO_PACKS/contents/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Al PACKS_TOKEN le falta el permiso 'Contents: Read-only'. Ve a https://github.com/settings/personal-access-tokens (con la cuenta duena del repo privado), abre el token, seccion 'Repository permissions', pon Contents = Read-only y guarda con 'Update token'."
            exit 1
          fi
          echo "OK: el token puede clonar el repositorio"

      - name: Clonar los packs desde el repo privado
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPO_PACKS }}
          token: ${{ secrets.PACKS_TOKEN }}
          path: packs

      - name: Descargar el servidor Bedrock
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" \
            -o bds.zip \
            "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${BDS_VERSION}.zip"
          mkdir -p server
          unzip -q bds.zip -d server
          rm bds.zip
          echo "BDS $BDS_VERSION descomprimido"

      - name: Montar el modpack
        run: |
          set -euo pipefail
          # los packs del repo privado pisan a los del servidor si coinciden
          cp -r packs/behavior_packs/* server/behavior_packs/
          cp -r packs/resource_packs/* server/resource_packs/
          cp packs/server.properties server/server.properties
          echo "Packs instalados:"
          ls packs/behavior_packs | wc -l
          ls packs/resource_packs | wc -l

      - name: Ajustar configuracion para el runner
        run: |
          set -euo pipefail
          cd server
          # El runner tiene 4 vCPU y 16 GB: mas holgado que el PC de casa.
          sed -i 's/^max-threads=.*/max-threads=3/'      server.properties
          sed -i 's/^view-distance=.*/view-distance=10/' server.properties
          sed -i 's/^tick-distance=.*/tick-distance=6/'  server.properties
          grep -E '^(max-players|view-distance|tick-distance|max-threads|level-name)=' server.properties

      - name: Restaurar el mundo de la sesion anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "server/worlds/${MUNDO}"
          if gh release download mundo --repo "${{ github.repository }}" --pattern world.zip --dir . 2>/dev/null; then
            unzip -q world.zip -d "server/worlds/${MUNDO}"
            rm world.zip
            echo "Mundo restaurado ($(du -sh server/worlds/${MUNDO} | cut -f1))"
          else
            echo "No hay mundo guardado todavia: se creara uno nuevo"
          fi
          # registrar los packs SIEMPRE (por si el mundo venia sin ellos)
          cp packs/_world_config/world_behavior_packs.json "server/worlds/${MUNDO}/"
          cp packs/_world_config/world_resource_packs.json "server/worlds/${MUNDO}/"

      - name: Levantar el tunel de playit.gg
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYIT_SECRET:-}" ]; then
            echo "::error::Falta el secreto PLAYIT_SECRET. Sin el, nadie puede conectarse."
            exit 1
          fi
          curl -fsSL -o playit \
            "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64"
          chmod +x playit
          nohup ./playit --secret "$PLAYIT_SECRET" > playit.log 2>&1 &

          # Esperar a que el agente negocie el tunel
          for i in $(seq 1 12); do
            sleep 5
            grep -qiE 'joinmc\.link|ply\.gg|playit\.gg' playit.log && break
          done

          echo "--- log de playit ---"
          tail -30 playit.log || true

          # Sacar la direccion y dejarla BIEN VISIBLE en el resumen de la ejecucion,
          # que sale arriba del todo en la pagina del run.
          DIR=$(grep -oiE '[a-z0-9-]+\.(gl\.joinmc\.link|joinmc\.link|ply\.gg|playit\.gg)(:[0-9]+)?' playit.log | head -1 || true)

          {
            echo "# Servidor Bedrock en marcha"
            echo ""
            if [ -n "$DIR" ]; then
              echo '## Direccion para entrar'
              echo ""
              echo '```'
              echo "$DIR"
              echo '```'
              echo ""
              echo "Si no lleva puerto, usa el que te diga playit en su panel."
            else
              echo '## No se pudo leer la direccion del log'
              echo ""
              echo "Miralo en https://playit.gg/account/tunnels (agente **lionel**)."
            fi
            echo ""
            echo "- Minecraft **1.26.20+** | 16 packs | 6 jugadores"
            echo "- La primera conexion descarga **31 MB** de packs: parece colgado pero no lo esta."
            echo "- Escribe **\`!guia\`** en el chat para abrir la Cronica del Cataclismo."
            echo "- El servidor se reinicia solo cada ~5h35m. La direccion NO cambia."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$DIR" ]; then
            echo "::notice title=Direccion del servidor::$DIR"
          fi

      - name: Arrancar el servidor
        id: servidor
        run: |
          set -euo pipefail
          MIN="${{ github.event.inputs.minutos || '335' }}"
          SEGS=$(( MIN * 60 ))
          cd server
          chmod +x bedrock_server

          # FIFO para poder mandarle 'stop' limpiamente y no matar el proceso:
          # matarlo a lo bruto deja la base de datos LevelDB a medio escribir.
          #
          # Se abre en lectura-escritura (3<>) a proposito: abrir un FIFO solo
          # para escritura se queda bloqueado hasta que alguien lo abra para
          # leer, y aqui el lector es el propio servidor, que aun no ha
          # arrancado. Asi ademas el servidor nunca ve EOF en su stdin.
          mkfifo /tmp/bds_in
          exec 3<> /tmp/bds_in
          LD_LIBRARY_PATH=. ./bedrock_server < /tmp/bds_in &
          BDS=$!

          echo "Servidor arrancado (PID $BDS). Correra $MIN minutos."
          # Aviso a los jugadores 5 minutos antes del reinicio
          if [ "$SEGS" -gt 300 ]; then
            sleep $(( SEGS - 300 ))
            echo 'say §e[Servidor] Reinicio programado en 5 minutos. El mundo se guarda automaticamente.' >&3
            sleep 240
            echo 'say §c[Servidor] Reiniciando en 60 segundos...' >&3
            sleep 60
          else
            sleep "$SEGS"
          fi

          echo "Enviando stop..."
          echo 'stop' >&3
          wait $BDS || true
          echo "Servidor detenido limpiamente"

      - name: Guardar el mundo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d "server/worlds/${MUNDO}/db" ]; then
            echo "::warning::No hay mundo que guardar"
            exit 0
          fi
          cd "server/worlds/${MUNDO}"
          zip -qr /tmp/world.zip .
          cd -
          echo "Mundo comprimido: $(du -h /tmp/world.zip | cut -f1)"
          gh release view mundo --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create mundo --repo "${{ github.repository }}" \
                 --title "Mundo guardado" --notes "Ultima partida guardada automaticamente."
          gh release upload mundo /tmp/world.zip --repo "${{ github.repository }}" --clobber
          echo "Mundo subido a la release 'mundo'"

      # Solo se encadena si el servidor LLEGO A ARRANCAR. Antes se relanzaba
      # pase lo que pase, asi que un secreto mal puesto generaba un bucle de
      # ejecuciones fallidas una detras de otra.
      - name: Encadenar la siguiente sesion
        if: always() && steps.servidor.conclusion != 'skipped'
        env:
          # GITHUB_TOKEN no puede disparar otro workflow (proteccion anti-bucle):
          # hace falta un token personal, y de ESTA cuenta, no la de los packs.
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run servidor.yml --repo "${{ github.repository }}" \
            -f minutos="${{ github.event.inputs.minutos || '335' }}"
          echo "Siguiente sesion encolada"
