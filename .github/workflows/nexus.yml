name: NEXUS Java Server

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operación a ejecutar en el servidor"
        required: true
        default: "run-server"
        type: choice
        options:
          - "run-server"
          - "pregen"
          - "validate"
      session_minutes:
        description: "Duración de juego en minutos (máximo seguro 330)"
        required: false
        default: "325"
      restore_world:
        description: "Restaurar estado guardado del mundo desde NEXUS STORAGE"
        required: false
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      debug_mode:
        description: "Activar modo debug y verbose logging"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: nexus-java-server
  cancel-in-progress: false

permissions:
  contents: read

env:
  STORAGE_REPO: "cleoleobel/nexus-storage"
  NEXUS_STORAGE_TOKEN: ${{ secrets.NEXUS_STORAGE_TOKEN }}
  PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
  MINECRAFT_PUBLIC_HOST: ${{ vars.MINECRAFT_PUBLIC_HOST }}
  VOICECHAT_PUBLIC_HOST: ${{ vars.VOICECHAT_PUBLIC_HOST }}
  NEXUS_ONLINE_MODE: ${{ vars.NEXUS_ONLINE_MODE || 'true' }}
  NEXUS_OPERATION: ${{ inputs.operation || 'run-server' }}
  SESSION_MINUTES: ${{ inputs.session_minutes || '325' }}
  RESTORE_WORLD: ${{ inputs.restore_world || 'yes' }}
  NEXUS_SERVER_VERSION: "2026.08.08-01"

jobs:
  nexus-server:
    name: Despliegue NEXUS Dedicated Server
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: ETAPA 1 - Checkout Repositorio Runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ETAPA 1.2 - Validar Secretos y Variables
        run: |
          echo "=== VALIDANDO SECRETOS DE INFRAESTRUCTURA NEXUS ==="
          fallo=0
          if [ -z "${NEXUS_STORAGE_TOKEN:-}" ]; then
            echo "::error::Falta el secreto 'NEXUS_STORAGE_TOKEN'. Agregalo en Settings > Secrets > Actions."
            fallo=1
          fi
          if [ -z "${PLAYIT_SECRET:-}" ]; then
            if [ "$NEXUS_OPERATION" = "run-server" ]; then
              echo "::error::PLAYIT_SECRET es obligatorio para una sesión pública con TCP y UDP."
              fallo=1
            else
              echo "::warning::PLAYIT_SECRET no configurado durante $NEXUS_OPERATION."
            fi
          fi
          if [ "$NEXUS_OPERATION" = "run-server" ] && [ -z "${MINECRAFT_PUBLIC_HOST:-}" ]; then
            echo "::error::Falta la variable MINECRAFT_PUBLIC_HOST con el endpoint TCP de Playit."
            fallo=1
          fi
          if [ "$NEXUS_OPERATION" = "run-server" ] && [ -z "${VOICECHAT_PUBLIC_HOST:-}" ]; then
            echo "::error::Falta la variable VOICECHAT_PUBLIC_HOST con el endpoint UDP de Playit."
            fallo=1
          fi
          if [ "$fallo" -eq 1 ]; then
            exit 1
          fi
          echo "Secretos validados correctamente."

      - name: ETAPA 2 - Diagnóstico del System Runner
        run: |
          echo "=================================================="
          echo "   INFORMACIÓN DEL SISTEMA DEL RUNNER GITHUB"
          echo "=================================================="
          echo "CPU Model:"
          lscpu | grep "Model name\|CPU(s):" || true
          echo "RAM Total:"
          free -h
          echo "Espacio en Disco:"
          df -h .
          echo "Kernel y Arquitectura:"
          uname -a
          echo "IP Pública Aproximada del Runner:"
          curl -s https://ifconfig.me || true
          echo ""

      - name: ETAPA 3 - Instalar Java 17 JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ETAPA 4 - Descargar Server Bundle desde NEXUS STORAGE
        run: |
          chmod +x scripts/nexus/*.sh scripts/network/*.sh
          bash scripts/nexus/download-bundle.sh

      - name: ETAPA 5 - Verificar SHA-256 del Bundle
        run: |
          bash scripts/nexus/verify-bundle.sh

      - name: ETAPA 6 - Extraer Servidor Forge
        run: |
          tar --no-same-owner --no-same-permissions -xzf download_bundle/server-bundle.tar.gz -C ./
          rm -rf download_bundle

      - name: ETAPA 6.5 - Compilar e Inyectar Mod Anti-Crash (nexus-core)
        run: |
          cd src/nexus-core
          chmod +x gradlew
          ./gradlew build
          for entry in \
            com/nexus/core/mixin/ArmorStandMixin.class \
            com/nexus/core/mixin/CataclysmSpellbooksEntityRegistryMixin.class \
            nexus.mixins.json \
            nexus.refmap.json \
            data/irons_spellbooks/loot_tables/chests/catacombs/crypt_loot.json \
            data/irons_spellbooks/loot_tables/chests/citadel/citadel_tomes.json \
            data/nexus/recipes/technomantic_crystal.json; do
            if ! jar tf build/libs/nexus-core-1.0.0.jar | grep -Fxq "$entry"; then
              echo "::error::nexus-core no contiene el recurso obligatorio $entry"
              exit 1
            fi
          done
          cp build/libs/nexus-core-1.0.0.jar ../../mods/nexus-core-1.0.0.jar

      - name: ETAPA 7 - Restaurar Estado Persistente del Mundo
        run: |
          bash scripts/nexus/restore-world.sh

      - name: ETAPA 8, 9, 10, 11 & 13 - Ejecutar Servidor NEXUS y Mantener Sesión
        run: |
          bash scripts/nexus/start-server.sh "$NEXUS_OPERATION"

      # (Step Summary movido al final del workflow)

      - name: ETAPA 14, 15 & 16 - Apagado Limpio del Servidor
        if: always()
        run: |
          bash scripts/nexus/stop-server.sh || true

      - name: ETAPA 17 - Empaquetar y Verificar Backup del Mundo
        if: always()
        run: |
          mkdir -p session_diagnostics
          bash scripts/nexus/backup-world.sh

      - name: ETAPA 18 & 19 - Subir Backup a NEXUS STORAGE y Verificar
        if: always()
        run: |
          bash scripts/nexus/upload-world.sh

      - name: ETAPA 12 - Publicar Step Summary en GitHub Actions
        if: always()
        run: |
          echo "## 🚀 NEXUS Dedicated Server — Resumen de Ejecución" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica / Componente | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          
          # Funciones para leer estado dinámico
          get_status() {
            local file="session_diagnostics/status_$1.txt"
            if [ -f "$file" ]; then cat "$file"; else echo "UNVERIFIED"; fi
          }
          
          echo "| FORGE_BOOT | $(get_status server) |" >> $GITHUB_STEP_SUMMARY
          echo "| CLEAN_STOP | $(get_status stop) |" >> $GITHUB_STEP_SUMMARY
          echo "| BACKUP | $(get_status backup) |" >> $GITHUB_STEP_SUMMARY
          echo "| REMOTE_SHA | $(get_status upload_sha) |" >> $GITHUB_STEP_SUMMARY
          echo "| RESTORE_SHA | $(get_status restore_sha) |" >> $GITHUB_STEP_SUMMARY
          echo "| PLAYIT_SECRET | $(get_status playit_secret) |" >> $GITHUB_STEP_SUMMARY
          echo "| PLAYIT_AGENT | $(get_status playit_agent) |" >> $GITHUB_STEP_SUMMARY
          echo "| MINECRAFT_TUNNEL | $(get_status minecraft_tunnel) |" >> $GITHUB_STEP_SUMMARY
          echo "| VOICE_TUNNEL | $(get_status voice_tunnel) |" >> $GITHUB_STEP_SUMMARY
          echo "| VOICE_UDP_SOCKET | $(get_status voice_udp_socket) |" >> $GITHUB_STEP_SUMMARY
          echo "| SVC_CONFIG | $(get_status svc_config) |" >> $GITHUB_STEP_SUMMARY
          echo "| RUNTIME_LOG_ERRORS | $(get_status runtime_errors) |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Recursos del Runner" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          free -h >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: ETAPA 20 - Diagnóstico Final y Artefactos
        if: always()
        run: |
          mkdir -p session_diagnostics
          cp -f logs/latest.log session_diagnostics/latest.log 2>/dev/null || true
          cp -f logs/playit.log session_diagnostics/playit.log 2>/dev/null || true
          if [ -d "crash-reports" ]; then
            cp -r crash-reports session_diagnostics/ || true
          fi
          cat << EOF > session_diagnostics/session-summary.txt
          NEXUS SESSION SUMMARY
          Version: $NEXUS_SERVER_VERSION
          Date: $(date)
          Operation: $NEXUS_OPERATION
          EOF

      - name: ETAPA 20.2 - Subir Diagnóstico como Artefacto
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nexus-session-diagnostics-run${{ github.run_number }}
          path: session_diagnostics/
          retention-days: 7
